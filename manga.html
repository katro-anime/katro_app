
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8855ff">
<title>KATRO Manga</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#fff;font-family:Arial,Tahoma,sans-serif}
header{background:#111827;padding:15px;position:sticky;top:0;z-index:10;border-bottom:1px solid #263246}
.logo{font-size:25px;font-weight:900;color:#a78bfa;margin-bottom:12px}
input,button,select{font:inherit;border:0;border-radius:10px;padding:12px}
input,select{background:#202938;color:white;width:100%}
button{background:#8855ff;color:white;font-weight:bold;cursor:pointer}
button:active{opacity:.75}
.tabs{display:flex;gap:8px;margin-top:12px}
.tabs button{flex:1}
.container{padding:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#151d2a;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #263246}
.card img{width:100%;height:230px;object-fit:cover;background:#202938}
.card .info{padding:10px}
.card h3{margin:0 0 5px;font-size:14px}
.card p{margin:0;font-size:12px;color:#9ba9bc}
.panel{background:#151d2a;padding:14px;border-radius:13px;margin-bottom:14px}
.status{text-align:center;padding:20px;color:#aaa}
.chapter{background:#202938;border-radius:10px;padding:13px;margin:8px 0}
.chapter small{color:#b3b8c8;display:block;margin-top:5px}
.chapterActions{display:flex;gap:8px;margin-top:10px}
.chapterActions button{flex:1;padding:10px;font-size:13px}
.secondary{background:#303b50}
.danger{background:#a83248}
.hidden{display:none!important}
#reader{position:fixed;inset:0;background:#05070b;z-index:100;overflow:auto}
.readerTop{position:sticky;top:0;background:#111827;padding:12px;display:flex;gap:8px;align-items:center;z-index:2}
.readerTop button{padding:10px}
.readerTitle{flex:1;font-size:14px;text-align:center}
.pages img{display:block;width:100%;max-width:900px;margin:auto;background:#111;min-height:50px}
.downloadItem{background:#202938;padding:12px;border-radius:10px;margin:10px 0}
.downloadItem button{margin:8px 4px 0 0}
#detailCover{width:140px;height:200px;object-fit:cover;border-radius:10px}
.detailHeader{display:flex;gap:12px;align-items:flex-start}
#moreSearch{width:100%;margin-top:15px}
.progressText{font-size:13px;color:#b9a5ff;margin-top:8px}
@media(min-width:650px){
.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.card img{height:300px}
}
</style>
</head>

<body>

<header>
<div class="logo">KATRO MANGA</div>
<input id="search" placeholder="ابحث عن مانغا..." autocomplete="off">

<div class="tabs">
<button onclick="showTab('searchTab')">المانغا</button>
<button onclick="showTab('downloadsTab')">تحميلاتي 📥</button>
</div>
</header>

<div class="container">

<section id="searchTab">
<div id="results" class="grid"></div>
<div id="searchStatus" class="status">جاري تحميل المانغا...</div>
<button id="moreSearch" class="hidden" onclick="loadMoreSearch()">تحميل المزيد</button>
</section>

<section id="downloadsTab" class="hidden">
<h3>📥 تحميلاتي</h3>
<div id="downloadsList"></div>
</section>

<section id="detailTab" class="hidden">

<button class="secondary" onclick="backToSearch()">⬅ رجوع</button>

<div class="panel detailHeader" style="margin-top:12px">
<img id="detailCover" src="" alt="غلاف">
<div>
<h3 id="detailTitle"></h3>
<p id="detailDescription"></p>
</div>
</div>

<div class="panel">
<label>لغة الفصول</label>

<select id="language">
<option value="ar">العربية (مع البحث البديل)</option>
<option value="en">English (مع البحث البديل)</option>
<option value="all">كل اللغات</option>
</select>

<button style="width:100%;margin-top:10px" onclick="loadChapters(true)">
عرض الفصول
</button>
</div>

<div id="chapters"></div>

</section>
</div>

<div id="reader" class="hidden">

<div class="readerTop">
<button onclick="closeReader()">✕</button>
<button class="secondary" onclick="readerPrevious()">السابق</button>
<div class="readerTitle" id="readerTitle">قارئ KATRO</div>
<button onclick="readerNext()">التالي</button>
</div>

<div id="readerPages" class="pages"></div>
</div>

<script>

const API="https://katro-manga-api.mmmzzz126038.workers.dev";

let searchOffset=0;
let currentManga=null;
let currentChapter=null;
let currentChapterList=[];
let currentReaderIndex=-1;

let searchBusy=false;
let chapterLoading=false;
let chapterOffset=0;
let chapterTotal=0;
let chapterMode="all";
let searchTimer;

const languageNames={
ar:"العربية",
en:"الإنجليزية",
fr:"الفرنسية",
es:"الإسبانية",
pt:"البرتغالية",
ru:"الروسية",
ja:"اليابانية",
ko:"الكورية",
zh:"الصينية",
de:"الألمانية",
it:"الإيطالية",
tr:"التركية",
id:"الإندونيسية",
th:"التايلندية",
vi:"الفيتنامية",
pl:"البولندية",
uk:"الأوكرانية",
fa:"الفارسية",
ms:"الماليزية",
nl:"الهولندية"
};

const results=document.getElementById("results");
const searchStatus=document.getElementById("searchStatus");
const moreSearch=document.getElementById("moreSearch");

/* التنقل */

function showTab(id){

["searchTab","downloadsTab","detailTab"].forEach(x=>{
document.getElementById(x).classList.add("hidden");
});

document.getElementById(id).classList.remove("hidden");

if(id==="downloadsTab"){
loadDownloads();
}
}

function backToSearch(){
showTab("searchTab");
}

/* الأغلفة */

function coverURL(m){

const cover=m.relationships?.find(x=>x.type==="cover_art");

if(!cover?.attributes?.fileName)return "";

return API+"/covers/"+m.id+"/"+encodeURIComponent(cover.attributes.fileName)+".256.jpg";
}

/* أسماء المانغا */

function titleOf(m){

const t=m.attributes?.title||{};

return t.ar||t.en||Object.values(t)[0]||"مانغا بدون اسم";
}

function englishTitle(m){
return m.attributes?.title?.en||"";
}

function descriptionOf(m){

const d=m.attributes?.description||{};

return d.ar||d.en||Object.values(d)[0]||"";
}

/* إنشاء بطاقة */

function createCard(m){

const card=document.createElement("div");
card.className="card";

const img=document.createElement("img");
img.loading="lazy";
img.src=coverURL(m);

img.onerror=()=>{
img.onerror=null;

img.src="data:image/svg+xml,"+encodeURIComponent(
'<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="100%" height="100%" fill="#202938"/><text x="50%" y="50%" fill="white" font-size="30" text-anchor="middle">KATRO</text></svg>'
);
};

const info=document.createElement("div");
info.className="info";

const h=document.createElement("h3");
h.textContent=titleOf(m);

const p=document.createElement("p");

p.textContent=englishTitle(m)!==titleOf(m)
?englishTitle(m)
:"اضغط لعرض الفصول";

info.appendChild(h);
info.appendChild(p);

card.appendChild(img);
card.appendChild(info);

card.onclick=()=>openManga(m);

return card;
}

/* البحث */

async function searchManga(reset=true){

if(searchBusy)return;

searchBusy=true;

if(reset){
searchOffset=0;
results.innerHTML="";
moreSearch.classList.add("hidden");
}

searchStatus.textContent="جاري البحث...";

const q=document.getElementById("search").value.trim();

try{

let url=API+"/manga?limit=100&offset="+searchOffset+
"&includes[]=cover_art&contentRating[]=safe&order[relevance]=desc";

if(q){
url+="&title="+encodeURIComponent(q);
}

const r=await fetch(url);

if(!r.ok)throw Error("Search failed");

const data=await r.json();

if(reset&&(!data.data||data.data.length===0)){
searchStatus.textContent="لم يتم العثور على نتائج";
searchBusy=false;
return;
}

(data.data||[]).forEach(m=>{
results.appendChild(createCard(m));
});

searchOffset+=(data.data||[]).length;

searchStatus.textContent=data.data?.length
?""
:"لا توجد نتائج أخرى";

if(data.data&&data.data.length){
moreSearch.classList.remove("hidden");
}else{
moreSearch.classList.add("hidden");
}

}catch(e){

searchStatus.textContent="فشل الاتصال. حاول مرة أخرى.";

}

searchBusy=false;
}

function loadMoreSearch(){
searchManga(false);
}

document.getElementById("search").addEventListener("input",()=>{

clearTimeout(searchTimer);

searchTimer=setTimeout(()=>{
searchManga(true);
},500);

});

/* صفحة المانغا */

async function openManga(m){

currentManga=m;

showTab("detailTab");

document.getElementById("detailCover").src=coverURL(m);
document.getElementById("detailTitle").textContent=titleOf(m);

const en=englishTitle(m);

if(en&&en!==titleOf(m)){
document.getElementById("detailTitle").textContent=titleOf(m)+" | "+en;
}

document.getElementById("detailDescription").textContent=descriptionOf(m);

document.getElementById("chapters").innerHTML=
'<div class="status">اختر اللغة واضغط عرض الفصول</div>';

currentChapterList=[];
chapterOffset=0;
chapterTotal=0;
}

/* الفصول */

/* ترتيب أرقام الفصول */
function chapterNumber(ch){

const value=ch?.attributes?.chapter;

if(value===null||value===undefined||value===""){
return null;
}

const num=parseFloat(String(value).replace(/[^0-9.]/g,""));

return Number.isFinite(num)?num:null;
}

function sortChapters(list){

return list.sort((a,b)=>{

const na=chapterNumber(a);
const nb=chapterNumber(b);

if(na===null&&nb===null)return 0;
if(na===null)return 1;
if(nb===null)return -1;

return na-nb;
});
}

/* طلب الفصول من MangaDex */

async function fetchChapterFeed(language,offset=0){

const limit=100;

let url=API+"/manga/"+currentManga.id+
"/feed?limit="+limit+
"&offset="+offset+
"&order[chapter]=asc";

if(language&&language!=="all"){
url+="&translatedLanguage[]="+encodeURIComponent(language);
}

const response=await fetch(url);

if(!response.ok){
throw new Error("Feed HTTP "+response.status);
}

return await response.json();
}

function removeChapterStatus(){

const box=document.getElementById("chapters");

box.querySelectorAll(".status").forEach(el=>{
el.remove();
});
}

function removeMoreChapters(){

const old=document.getElementById("moreChapters");

if(old)old.remove();
}

/* زر المزيد */

function showMoreChaptersButton(){

removeMoreChapters();

if(chapterOffset>=chapterTotal)return;

const more=document.createElement("button");

more.id="moreChapters";
more.textContent="تحميل المزيد من الفصول";
more.style.width="100%";
more.style.margin="12px 0";

more.onclick=()=>{
more.remove();
loadChapters(false);
};

document.getElementById("chapters").appendChild(more);
}

/* تحميل الفصول مع اللغات البديلة */

async function loadChapters(reset=true){

const box=document.getElementById("chapters");

if(chapterLoading)return;

chapterLoading=true;

if(reset){

chapterOffset=0;
chapterMode=document.getElementById("language").value;
chapterTotal=0;

box.innerHTML="";
currentChapterList=[];
removeMoreChapters();

}

const status=document.createElement("div");
status.className="status";
status.textContent=reset
?"جاري البحث عن الفصول..."
:"جاري تحميل المزيد...";

box.appendChild(status);

try{

let data;

/* عند البداية */
if(reset){

/* العربية */
if(chapterMode==="ar"){

status.textContent="جاري البحث عن الفصول العربية...";

data=await fetchChapterFeed("ar",0);

if(!data.data?.length){

status.textContent="لا توجد فصول عربية، جاري البحث عن الإنجليزية...";

data=await fetchChapterFeed("en",0);

if(data.data?.length){

chapterMode="en";

}else{

status.textContent="لا توجد فصول إنجليزية، جاري البحث في كل اللغات...";

data=await fetchChapterFeed("",0);

chapterMode="all";

}

}

/* الإنجليزية */
}else if(chapterMode==="en"){

status.textContent="جاري البحث عن الفصول الإنجليزية...";

data=await fetchChapterFeed("en",0);

if(!data.data?.length){

status.textContent="لا توجد فصول إنجليزية، جاري البحث في كل اللغات...";

data=await fetchChapterFeed("",0);

chapterMode="all";

}

/* كل اللغات */
}else{

status.textContent="جاري تحميل جميع الفصول...";

data=await fetchChapterFeed("",0);

}

}else{

/* المزيد من الفصول */
data=await fetchChapterFeed(
chapterMode==="all"?"":chapterMode,
chapterOffset
);

}

removeChapterStatus();

const chapters=data.data||[];

chapterTotal=Number(data.total||0);

if(!chapters.length){

if(reset){

box.innerHTML=
'<div class="status">لم يتم العثور على فصول لهذه المانغا.</div>';

}else{

box.insertAdjacentHTML(
"beforeend",
'<div class="status">لا توجد فصول أخرى.</div>'
);

}

chapterLoading=false;
return;
}

/* ترتيب */
sortChapters(chapters);

/* إضافة الفصول */
chapters.forEach(ch=>{

if(currentChapterList.some(x=>x.id===ch.id)){
return;
}

currentChapterList.push(ch);

const row=document.createElement("div");
row.className="chapter";

const num=ch.attributes?.chapter||"؟";
const name=ch.attributes?.title||"";
const lang=ch.attributes?.translatedLanguage||"";
const langName=languageNames[lang]||lang||"غير معروف";

const title=document.createElement("div");

title.textContent="الفصل "+num+(name?" - "+name:"");

const info=document.createElement("small");

info.textContent="🌐 "+langName;

row.appendChild(title);
row.appendChild(info);

const actions=document.createElement("div");
actions.className="chapterActions";

const readBtn=document.createElement("button");

readBtn.textContent="📖 قراءة";

readBtn.onclick=(e)=>{
e.stopPropagation();
readChapter(ch);
};

const downloadBtn=document.createElement("button");

downloadBtn.textContent="⬇ تحميل";
downloadBtn.className="secondary";

downloadBtn.onclick=(e)=>{
e.stopPropagation();
downloadChapter(ch);
};

actions.appendChild(readBtn);
actions.appendChild(downloadBtn);

row.appendChild(actions);

row.onclick=()=>readChapter(ch);

box.appendChild(row);

});

/* تحديث التقدم */
chapterOffset+=chapters.length;

/* المزيد */
if(chapterOffset<chapterTotal){
showMoreChaptersButton();
}

/* اللغة المستخدمة */
if(reset){

let modeText="";

if(chapterMode==="ar"){
modeText="العربية";
}else if(chapterMode==="en"){
modeText="الإنجليزية";
}else{
modeText="جميع اللغات";
}

const langStatus=document.createElement("div");

langStatus.className="status";
langStatus.textContent="لغة الفصول: "+modeText;

box.prepend(langStatus);

}

}catch(e){

removeChapterStatus();

const error=document.createElement("div");

error.className="status";
error.textContent="تعذر تحميل الفصول. حاول تغيير اللغة أو إعادة المحاولة.";

box.appendChild(error);

}

chapterLoading=false;
}

/* روابط صور الفصل */

async function getChapterPages(ch){

const r=await fetch(API+"/at-home/server/"+ch.id);

if(!r.ok){
throw Error("Chapter server unavailable");
}

const data=await r.json();

const base=data.baseUrl;
const hash=data.chapter?.hash;

const files=data.chapter?.data||[];
const saverFiles=data.chapter?.dataSaver||files;

if(!base||!hash||!files.length){
throw Error("No chapter pages");
}

/* روابط الجودة الكاملة والبديلة */
return files.map((file,i)=>({

primary:base+"/data/"+hash+"/"+encodeURIComponent(file),

fallback:base+"/data-saver/"+hash+"/"+encodeURIComponent(saverFiles[i]||file)

}));

}

/* تحميل صورة مع رابط بديل */

function createReaderImage(page,i){

const img=document.createElement("img");

img.loading=i<3?"eager":"lazy";
img.alt="صفحة "+(i+1);
img.src=page.primary;

img.onerror=()=>{

if(img.dataset.fallbackUsed)return;

img.dataset.fallbackUsed="1";

img.src=page.fallback;

img.onerror=()=>{

img.onerror=null;
img.alt="تعذر تحميل الصفحة "+(i+1);
img.style.minHeight="180px";
img.style.background="#202938";
};

};

};

return img;
}

/* القارئ */

async function readChapter(ch){

currentChapter=ch;

currentReaderIndex=currentChapterList.findIndex(x=>x.id===ch.id);

document.getElementById("reader").classList.remove("hidden");

document.getElementById("readerTitle").textContent=
"الفصل "+(ch.attributes?.chapter||"");

const pages=document.getElementById("readerPages");

pages.innerHTML='<div class="status">جاري تحميل صفحات الفصل...</div>';

try{

const pageList=await getChapterPages(ch);

pages.innerHTML="";

pageList.forEach((page,i)=>{
pages.appendChild(createReaderImage(page,i));
});

if(!pageList.length){
pages.innerHTML='<div class="status">هذا الفصل لا يحتوي على صفحات.</div>';
}

}catch(e){

pages.innerHTML=
'<div class="status">تعذر تحميل صفحات الفصل. حاول مرة أخرى.</div>';

}

}

function closeReader(){
document.getElementById("reader").classList.add("hidden");
}

function readerNext(){

if(currentReaderIndex>=0&&currentReaderIndex<currentChapterList.length-1){

readChapter(currentChapterList[currentReaderIndex+1]);

}

}

function readerPrevious(){

if(currentReaderIndex>0){

readChapter(currentChapterList[currentReaderIndex-1]);

}

}

/* قاعدة بيانات التنزيلات */

const DB_NAME="KATRO_MANGA_DB";
const DB_STORE="chapters";

function openDB(){

return new Promise((resolve,reject)=>{

const request=indexedDB.open(DB_NAME,1);

request.onupgradeneeded=()=>{

const db=request.result;

if(!db.objectStoreNames.contains(DB_STORE)){
db.createObjectStore(DB_STORE,{keyPath:"id"});
}

};

request.onsuccess=()=>resolve(request.result);
request.onerror=()=>reject(request.error);

});

}

async function saveChapterRecord(record){

const db=await openDB();

return new Promise((resolve,reject)=>{

const tx=db.transaction(DB_STORE,"readwrite");

tx.objectStore(DB_STORE).put(record);

tx.oncomplete=()=>resolve();
tx.onerror=()=>reject(tx.error);

});

}

async function getSavedChapter(id){

const db=await openDB();

return new Promise((resolve,reject)=>{

const tx=db.transaction(DB_STORE,"readonly");

const request=tx.objectStore(DB_STORE).get(id);

request.onsuccess=()=>resolve(request.result||null);
request.onerror=()=>reject(request.error);

});

}

async function getAllSaved(){

const db=await openDB();

return new Promise((resolve,reject)=>{

const tx=db.transaction(DB_STORE,"readonly");

const request=tx.objectStore(DB_STORE).getAll();

request.onsuccess=()=>resolve(request.result||[]);
request.onerror=()=>reject(request.error);

});

}

async function deleteSavedChapter(id){

const db=await openDB();

return new Promise((resolve,reject)=>{

const tx=db.transaction(DB_STORE,"readwrite");

tx.objectStore(DB_STORE).delete(id);

tx.oncomplete=()=>resolve();
tx.onerror=()=>reject(tx.error);

});

}

/* تنزيل الصور */

async function downloadImage(page){

let response=await fetch(page.primary);

if(!response.ok){
response=await fetch(page.fallback);
}

if(!response.ok){
throw new Error("Image download failed");
}

return await response.blob();

}

/* تنزيل فصل */

async function downloadChapter(ch){

try{

const id=ch.id;

const exists=await getSavedChapter(id);

if(exists){
alert("هذا الفصل محمّل بالفعل.");
return;
}

const chapterNum=ch.attributes?.chapter||"؟";
const lang=ch.attributes?.translatedLanguage||"";

const mangaName=currentManga
?titleOf(currentManga)
:"مانغا";

const urls=await getChapterPages(ch);
const pages=[];

for(let i=0;i<urls.length;i++){

const blob=await downloadImage(urls[i]);

pages.push(blob);

}

const record={

id:id,
mangaId:currentManga?.id||"",
mangaName:mangaName,
chapterNum:chapterNum,
language:languageNames[lang]||lang,
pages:pages,
savedAt:Date.now()

};

await saveChapterRecord(record);

alert("تم تحميل الفصل بنجاح! يمكنك قراءته دون إنترنت.");

}catch(e){

alert("تعذر تحميل الفصل. تأكد من الإنترنت ومساحة الهاتف.");

}

}

/* قائمة التنزيلات */

async function loadDownloads(){

const box=document.getElementById("downloadsList");

box.innerHTML='<div class="status">جاري تحميل التنزيلات...</div>';

try{

const saved=await getAllSaved();

box.innerHTML="";

if(!saved.length){

box.innerHTML='<div class="status">لا توجد فصول محمّلة بعد.</div>';
return;

}

saved.sort((a,b)=>b.savedAt-a.savedAt);

saved.forEach(item=>{

const div=document.createElement("div");
div.className="downloadItem";

const title=document.createElement("strong");
title.textContent=item.mangaName;

const info=document.createElement("p");

info.textContent=
"الفصل "+item.chapterNum+
" | "+item.language+
" | "+item.pages.length+" صفحة";

const read=document.createElement("button");

read.textContent="📖 قراءة دون إنترنت";
read.onclick=()=>readOffline(item);

const del=document.createElement("button");

del.className="danger";
del.textContent="حذف";

del.onclick=async()=>{

if(confirm("هل تريد حذف هذا الفصل؟")){

await deleteSavedChapter(item.id);
loadDownloads();

}

};

div.appendChild(title);
div.appendChild(info);
div.appendChild(read);
div.appendChild(del);

box.appendChild(div);

});

}catch(e){

box.innerHTML='<div class="status">تعذر عرض التنزيلات.</div>';

}

}

/* قراءة دون إنترنت */

function readOffline(item){

document.getElementById("reader").classList.remove("hidden");

document.getElementById("readerTitle").textContent=
item.mangaName+" - الفصل "+item.chapterNum;

const box=document.getElementById("readerPages");

box.innerHTML="";

<script>
'use strict';
const API='https://katro-manga-api.mmmzzz126038.workers.dev';
let searchOffset=0,searchBusy=false,chapterLoading=false,currentManga=null,currentChapter=null,currentChapterList=[],currentReaderIndex=-1,chapterOffset=0,chapterTotal=0,chapterMode='ar',searchTimer=null;
const arabicMap={'ون بيس':'One Piece','ناروتو':'Naruto','بليتش':'Bleach','هجوم العمالقة':'Attack on Titan','قاتل الشياطين':'Demon Slayer','جوجوتسو كايسن':'Jujutsu Kaisen','القناص':'Hunter x Hunter','هنتر':'Hunter x Hunter','دراغون بول':'Dragon Ball','بلاك كلوفر':'Black Clover','أكاديمية بطلي':'My Hero Academia','طوكيو غول':'Tokyo Ghoul','رجل المنشار':'Chainsaw Man','سولو ليفلينج':'Solo Leveling','بيرسيرك':'Berserk','مذكرة الموت':'Death Note','ون بنش مان':'One Punch Man','فيري تيل':'Fairy Tail','بلو لوك':'Blue Lock'};
const langNames={ar:'العربية',en:'الإنجليزية',fr:'الفرنسية',es:'الإسبانية',pt:'البرتغالية',ru:'الروسية',ja:'اليابانية',ko:'الكورية',zh:'الصينية',it:'الإيطالية',de:'الألمانية'};
function translateQuery(q){for(const [ar,en] of Object.entries(arabicMap)){if(q.includes(ar))return en;}return q;}
function showTab(id){['searchTab','detailTab','downloadsTab'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='downloadsTab'){updateNav('navDownloads');loadDownloads();}if(id==='searchTab')updateNav('navManga');}
function updateNav(id){['navManga','navManhwa','navAll','navDownloads'].forEach(x=>document.getElementById(x)?.classList.remove('active'));document.getElementById(id)?.classList.add('active');}
function selectCategory(type){document.getElementById('searchTypeFilter').value=type;const title={manga:'📚 المانغا اليابانية',manhwa:'🎨 المانهوا الكورية',all:'🌍 جميع الأعمال'};document.getElementById('categoryTitle').textContent=title[type]||title.all;document.getElementById('categoryBadge').textContent=type.toUpperCase();showTab('searchTab');searchManga(true);}
function onTypeFilterChange(){selectCategory(document.getElementById('searchTypeFilter').value);}
function titleOf(m){const t=m.attributes?.title||{};return t.ar||t.en||Object.values(t)[0]||m.title||m.name||'بدون عنوان';}
function englishTitle(m){return m.attributes?.title?.en||m.title||m.name||'';}
function descriptionOf(m){const d=m.attributes?.description||m.description||{};return typeof d==='string'?d:(d.ar||d.en||Object.values(d)[0]||'لا يوجد وصف متوفر');}
function coverURL(m,size='512'){const rel=m.relationships?.find(x=>x.type==='cover_art');const file=rel?.attributes?.fileName;if(!file)return '';return API+'/covers/'+m.id+'/'+encodeURIComponent(file)+'.'+size+'.jpg';}
function comickCover(m){return m.cover_url||m.cover||m.thumbnail||m.image_url||m.comic?.cover_url||m.comic?.cover||m.md_covers?.[0]?.b2key||'';}
function safeImage(img,url){img.src=url||'';img.onerror=function(){this.onerror=null;this.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="100%" height="100%" fill="#151d2a"/><text x="50%" y="50%" text-anchor="middle" fill="#8855ff" font-size="35" font-family="Arial">KATRO</text></svg>');};}
function originLabel(m){const origin=m.attributes?.originalLanguage||m.original_language||m.country||m.comic?.country||'';if(origin==='ko'||String(origin).toLowerCase().includes('korea'))return '🇰🇷 مانهوا';if(origin==='ja'||String(origin).toLowerCase().includes('japan'))return '🇯🇵 مانغا';if(origin==='zh'||String(origin).toLowerCase().includes('china'))return '🇨🇳 مانهوا';return 'كوميكس';}
function createCard(m,source){const card=document.createElement('article');card.className='card';const badges=document.createElement('div');badges.className='cardBadges';const tag=document.createElement('span');tag.textContent=source==='Comick'?'Comick':'MangaDex';badges.append(tag);const lang=(m.attributes?.availableTranslatedLanguages||m.availableTranslatedLanguages||[]);if(lang.includes('ar')){const ar=document.createElement('span');ar.textContent='🇸🇦 عربي';badges.append(ar);}const type=document.createElement('span');type.textContent=originLabel(m);badges.append(type);card.append(badges);const img=document.createElement('img');img.loading='lazy';img.alt=titleOf(m);safeImage(img,source==='Comick'?comickCover(m):coverURL(m,'256'));const info=document.createElement('div');info.className='cardInfo';const h=document.createElement('h3');h.textContent=titleOf(m);const p=document.createElement('p');p.textContent=source==='Comick'?'Comick • اضغط لعرض الفصول':englishTitle(m)||'اضغط لعرض الفصول';info.append(h,p);card.append(img,info);card.onclick=()=>source==='Comick'?openComick(m):openManga(m);return card;}
function comickListShape(data){if(Array.isArray(data))return data;if(Array.isArray(data?.results))return data.results;if(Array.isArray(data?.data))return data.data;if(Array.isArray(data?.comics))return data.comics;return [];}
function normalizeComick(m){const c=m.comic||m;return {...m,id:m.hid||m.id||c.hid||c.id,title:m.title||c.title||c.name||c.slug||'بدون عنوان',description:m.description||c.description||'',cover_url:comickCover(m)||comickCover(c),source:'Comick',hid:m.hid||c.hid||m.id||c.id,slug:m.slug||c.slug||''};}
function matchesCategory(m,type){const o=m.attributes?.originalLanguage||m.original_language||m.country||m.comic?.country||'';if(type==='manga')return o==='ja'||String(o).toLowerCase().includes('japan');if(type==='manhwa')return o==='ko'||String(o).toLowerCase().includes('korea');return true;}
async function searchManga(reset=true){if(searchBusy)return;const raw=document.getElementById('search').value.trim();if(!raw){if(reset){document.getElementById('results').innerHTML='';document.getElementById('moreSearch').classList.add('hidden');}const status=document.getElementById('searchStatus');status.textContent='اكتب اسم مانغا أو مانهوا لبدء البحث.';status.classList.remove('hidden');return;}searchBusy=true;const results=document.getElementById('results'),status=document.getElementById('searchStatus'),more=document.getElementById('moreSearch');if(reset){searchOffset=0;results.innerHTML='';more.classList.add('hidden');}status.textContent='جاري البحث...';status.classList.remove('hidden');const query=translateQuery(raw),type=document.getElementById('searchTypeFilter').value,source=document.getElementById('sourceFilter').value,lang=document.getElementById('searchLangFilter').value;let count=0,canMore=false;
try{if(source!=='comick'){const url=API+'/manga?limit=40&offset='+searchOffset+'&q='+encodeURIComponent(query);const response=await fetch(url);if(!response.ok)throw Error('MangaDex HTTP '+response.status);const data=await response.json();let items=(data.results||data.data||[]).filter(m=>matchesCategory(m,type));if(lang==='ar')items=items.filter(m=>(m.attributes?.availableTranslatedLanguages||[]).includes('ar'));items.forEach(m=>results.appendChild(createCard(m,'MangaDex')));count+=items.length;searchOffset+=(data.results||data.data||[]).length;canMore=(data.results||data.data||[]).length>=40;}
if(source!=='mangadex'){const cq=query||'popular';const r=await fetch(API+'/comick/search?q='+encodeURIComponent(cq)+'&limit=30');if(!r.ok)throw Error('Comick HTTP '+r.status);const d=await r.json();const list=comickListShape(d).map(normalizeComick).filter(m=>matchesCategory(m,type));list.forEach(m=>results.appendChild(createCard(m,'Comick')));count+=list.length;}
if(reset&&!count){status.textContent='لا توجد نتائج. جرّب اسم العمل باللغة الإنجليزية أو غيّر المصدر.';}else status.classList.add('hidden');more.classList.toggle('hidden',source==='comick'||!canMore);
}catch(e){status.textContent=count?'تعذر تحميل أحد المصادر. النتائج الموجودة ما زالت ظاهرة.':'تعذر الاتصال بالمصدر. تحقق من الإنترنت والـ Worker.';console.warn('Search error',e);}finally{searchBusy=false;}}
function loadMoreSearch(){searchManga(false);}document.getElementById('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>searchManga(true),450);});
function openManga(m){currentManga={...m,source:'MangaDex'};currentChapterList=[];chapterOffset=0;chapterTotal=0;showTab('detailTab');safeImage(document.getElementById('detailCover'),coverURL(m,'512'));document.getElementById('detailTitle').textContent=titleOf(m)+(englishTitle(m)&&englishTitle(m)!==titleOf(m)?' | '+englishTitle(m):'');document.getElementById('detailDescription').textContent=descriptionOf(m);document.getElementById('language').value='ar';createSourceLinks(m);loadChapters(true);}
function openComick(m){currentManga={...m,source:'Comick'};currentChapterList=[];chapterOffset=0;showTab('detailTab');safeImage(document.getElementById('detailCover'),comickCover(m));document.getElementById('detailTitle').textContent=titleOf(m);document.getElementById('detailDescription').textContent=descriptionOf(m)||'العمل من مصدر Comick. قد تتوفر الفصول حسب المصدر.';document.getElementById('language').value='all';createSourceLinks(m);loadComickChapters(true);}
function createSourceLinks(m){const box=document.getElementById('sourceLinks');box.innerHTML='';const links=currentManga?.source==='Comick'?[{name:'Comick',url:'https://comick.io/comic/'+(m.slug||m.hid||m.id)}]:[{name:'MangaDex',url:'https://mangadex.org/title/'+m.id}];links.forEach(source=>{const a=document.createElement('a');a.href=source.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='فتح المصدر: '+source.name;box.appendChild(a);});}
function chapterNum(ch){const n=ch?.attributes?.chapter??ch.chapter??ch.chapter_number;if(n===null||n===undefined||n==='')return null;const v=parseFloat(n);return Number.isFinite(v)?v:null;}function sortChapters(list){return list.sort((a,b)=>{const x=chapterNum(a),y=chapterNum(b);if(x===null&&y===null)return 0;if(x===null)return 1;if(y===null)return-1;return x-y;});}
async function fetchChapterFeed(language,offset=0){let url=API+'/manga/'+currentManga.id+'/feed?limit=100&offset='+offset;if(language)url+='&lang='+encodeURIComponent(language);const r=await fetch(url);if(!r.ok)throw Error('Feed HTTP '+r.status);return r.json();}
function chapterStatus(text){const el=document.createElement('div');el.className='status';el.textContent=text;return el;}
async function loadChapters(reset=true){if(chapterLoading)return;chapterLoading=true;const box=document.getElementById('chapters');if(reset){box.innerHTML='';chapterOffset=0;chapterTotal=0;currentChapterList=[];chapterMode=document.getElementById('language').value;}const status=chapterStatus('جاري البحث عن الفصول...');box.appendChild(status);try{let data,notice='';if(reset){if(chapterMode==='ar'||chapterMode==='ar_only'){data=await fetchChapterFeed('ar',0);if(!data.chapters?.length&&!data.data?.length&&chapterMode==='ar'){notice='لا توجد فصول عربية. نجرب الإنجليزية ثم اللغات الأخرى.';data=await fetchChapterFeed('en',0);if((data.chapters||data.data||[]).length)chapterMode='en';else{data=await fetchChapterFeed('',0);chapterMode='all';}}}else if(chapterMode==='en')data=await fetchChapterFeed('en',0);else{data=await fetchChapterFeed('',0);chapterMode='all';}}else data=await fetchChapterFeed(chapterMode==='all'?'':chapterMode,chapterOffset);status.remove();if(notice){const alert=document.createElement('div');alert.className='alertBox';alert.textContent=notice;box.appendChild(alert);}const items=data.chapters||data.data||[];chapterTotal=Number(data.total||items.length);if(!items.length){box.appendChild(chapterStatus('لا توجد فصول متاحة.'));return;}sortChapters(items);items.forEach(ch=>{if(currentChapterList.some(x=>x.id===ch.id))return;currentChapterList.push(ch);box.appendChild(createChapterRow(ch));});chapterOffset+=items.length;removeMoreChapters();if(chapterOffset<chapterTotal){const more=document.createElement('button');more.id='moreChapters';more.textContent='تحميل المزيد من الفصول';more.onclick=()=>loadChapters(false);box.appendChild(more);}}catch(e){status.textContent='تعذر تحميل الفصول. حاول مرة أخرى.';console.warn(e);}finally{chapterLoading=false;}}
function normalizeComickChapter(ch){return {id:ch.id||ch.chapter_id||ch.hid,chapter:ch.chapter||ch.chapter_number||ch.ch||'',title:ch.title||ch.name||'',url:ch.url||ch.external_url||'',lang:ch.lang||ch.language||ch.translatedLanguage||'en',raw:ch};}
async function loadComickChapters(reset=true){const box=document.getElementById('chapters');box.innerHTML='<div class="status">جاري طلب فصول Comick...</div>';try{const hid=currentManga.hid||currentManga.id;const r=await fetch(API+'/comick/chapters?hid='+encodeURIComponent(hid)+'&limit=100&page=1');if(!r.ok)throw Error('Comick chapters HTTP '+r.status);const data=await r.json();const items=(data.chapters||data.data||[]).map(normalizeComickChapter).filter(x=>x.id);box.innerHTML='';if(!items.length){box.innerHTML='<div class="status">لم يرجع Comick فصولاً لهذا العمل.</div>';return;}items.sort((a,b)=>(parseFloat(a.chapter)||0)-(parseFloat(b.chapter)||0));items.forEach(ch=>{const row=document.createElement('div');row.className='chapter';const title=document.createElement('strong');title.textContent='الفصل '+(ch.chapter||'?')+(ch.title?' — '+ch.title:'');const small=document.createElement('small');small.textContent='Comick • '+(langNames[ch.lang]||ch.lang);const actions=document.createElement('div');actions.className='chapterActions';const open=makeButton('فتح الفصل في المصدر',()=>{const link=ch.url||('https://comick.io/comic/'+encodeURIComponent(currentManga.slug||currentManga.hid)+'/'+encodeURIComponent(ch.id));window.open(link,'_blank','noopener');});actions.append(open);row.append(title,small,actions);box.append(row);});}catch(e){box.innerHTML='<div class="status">تعذر تحميل فصول Comick. مصدر MangaDex ما زال يعمل.</div>';console.warn(e);}}
function removeMoreChapters(){document.getElementById('moreChapters')?.remove();}function createChapterRow(ch){const row=document.createElement('div');row.className='chapter';const num=ch.attributes?.chapter||'?';const name=ch.attributes?.title||'';const lang=ch.attributes?.translatedLanguage||'';const title=document.createElement('strong');title.textContent='الفصل '+num+(name?' — '+name:'');const small=document.createElement('small');small.textContent='لغة الفصل: '+(langNames[lang]||lang);const actions=document.createElement('div');actions.className='chapterActions';actions.append(makeButton('📖 قراءة',()=>readChapter(ch)),makeButton('ZIP',()=>downloadChapterZIP(ch),'secondary'),makeButton('PDF',()=>downloadChapterPDF(ch),'secondary'),makeButton('📥 حفظ دون إنترنت',()=>saveChapterInternal(ch)));row.append(title,small,actions);return row;}
function makeButton(text,fn,cls=''){const b=document.createElement('button');b.textContent=text;if(cls)b.className=cls;b.onclick=fn;return b;}
async function getChapterPages(ch){const r=await fetch(API+'/at-home/server/'+encodeURIComponent(ch.id));if(!r.ok)throw Error('Reader API HTTP '+r.status);const d=await r.json(),base=d.baseUrl,hash=d.chapter?.hash,files=d.chapter?.data||[],saver=d.chapter?.dataSaver||[];if(!base||!hash||!files.length)throw Error('No chapter pages');return files.map((f,i)=>({primary:base+'/data/'+hash+'/'+encodeURIComponent(f),fallback:base+'/data-saver/'+hash+'/'+encodeURIComponent(saver[i]||f)}));}
function createReaderImage(page,i){const img=document.createElement('img');img.alt='صفحة '+(i+1);img.loading='lazy';img.src=page.primary;let attempt=0;img.onerror=()=>{attempt++;if(attempt===1)img.src=page.fallback;else if(attempt===2)img.src=page.primary+'?retry='+Date.now();else{img.onerror=null;img.alt='تعذر تحميل الصفحة '+(i+1);img.style.minHeight='200px';img.style.background='#202938';}};return img;}
async function readChapter(ch){currentChapter=ch;currentReaderIndex=currentChapterList.findIndex(x=>x.id===ch.id);document.getElementById('reader').classList.remove('hidden');document.getElementById('readerTitle').textContent='الفصل '+(ch.attributes?.chapter||'');const pages=document.getElementById('readerPages');pages.innerHTML='<div class="status">جاري تحميل الصفحات...</div>';try{const list=await getChapterPages(ch);pages.innerHTML='';list.forEach((p,i)=>pages.appendChild(createReaderImage(p,i)));}catch(e){pages.innerHTML='<div class="status">تعذر تحميل صفحات الفصل. حاول مرة أخرى.</div>';console.warn(e);}}
function closeReader(){document.getElementById('reader').classList.add('hidden');}function readerNext(){if(currentReaderIndex>=0&&currentReaderIndex<currentChapterList.length-1)readChapter(currentChapterList[currentReaderIndex+1]);}function readerPrevious(){if(currentReaderIndex>0)readChapter(currentChapterList[currentReaderIndex-1]);}
function createDownloadProgress(title){const box=document.createElement('div');box.className='download-progress-box';const label=document.createElement('strong');label.textContent=title;const track=document.createElement('div');track.className='download-progress-track';const bar=document.createElement('div');bar.className='download-progress-bar';track.append(bar);const info=document.createElement('div');info.className='download-progress-info';const percent=document.createElement('span');percent.className='download-progress-percent';percent.textContent='1%';const status=document.createElement('span');status.className='download-progress-status';status.textContent='جاري التحضير...';info.append(percent,status);box.append(label,track,info);document.getElementById('downloadsList').prepend(box);return{box,update(value,message){value=Math.max(1,Math.min(99,Math.floor(value)));bar.style.width=value+'%';percent.textContent=value+'%';if(message)status.textContent=message;},finish(){bar.style.width='100%';percent.textContent='100%';status.textContent='اكتمل التنزيل ✓';bar.style.background='#22c55e';},fail(message){status.textContent=message||'فشل التنزيل';bar.classList.add('download-progress-error');bar.style.background='#ef4444';}};}
async function fetchPageBlob(page){let r=await fetch(page.primary);if(!r.ok&&page.fallback)r=await fetch(page.fallback);if(!r.ok)throw Error('Page download failed '+r.status);return r.blob();}
async function downloadChapterZIP(ch){if(!window.JSZip){alert('مكتبة ZIP غير متاحة.');return;}const num=ch.attributes?.chapter||'؟',name=currentManga?titleOf(currentManga):'Manga',safe=name.replace(/[\/\\?%*:|"<>]/g,'');const progress=createDownloadProgress('ZIP - '+name+' - الفصل '+num);try{const pages=await getChapterPages(ch),zip=new JSZip(),folder=zip.folder(safe+' - Ch '+num);if(!pages.length)throw Error('No pages');for(let i=0;i<pages.length;i++){progress.update(1+(i/pages.length)*95,'تحميل الصفحة '+(i+1)+' من '+pages.length);const blob=await fetchPageBlob(pages[i]);folder.file(String(i+1).padStart(3,'0')+'.jpg',blob);progress.update(1+((i+1)/pages.length)*95,'تم تحميل '+(i+1)+' من '+pages.length);}progress.update(97,'ضغط الملفات...');const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=safe+'_Ch_'+num+'.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);progress.finish();}catch(e){progress.fail('تعذر تنزيل الفصل: '+(e.message||''));console.error(e);}}
async function downloadChapterPDF(ch){if(!window.jspdf?.jsPDF){alert('مكتبة PDF غير متاحة.');return;}const num=ch.attributes?.chapter||'؟',name=currentManga?titleOf(currentManga):'Manga',safe=name.replace(/[\/\\?%*:|"<>]/g,'');const progress=createDownloadProgress('PDF - '+name+' - الفصل '+num);try{const pages=await getChapterPages(ch);if(!pages.length)throw Error('No pages');const {jsPDF}=window.jspdf,pdf=new jsPDF('p','px',[595,842]);for(let i=0;i<pages.length;i++){progress.update(1+(i/pages.length)*95,'تحميل صفحة '+(i+1)+' من '+pages.length);const blob=await fetchPageBlob(pages[i]),dataURL=await blobToDataURL(blob);if(i>0)pdf.addPage([595,842]);const format=blob.type.includes('png')?'PNG':'JPEG';pdf.addImage(dataURL,format,0,0,595,842);progress.update(1+((i+1)/pages.length)*95,'تم تجهيز '+(i+1)+' من '+pages.length);}progress.update(98,'حفظ ملف PDF...');pdf.save(safe+'_Ch_'+num+'.pdf');progress.finish();}catch(e){progress.fail('فشل إنشاء PDF: '+(e.message||''));console.error(e);}}
function blobToDataURL(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error||new Error('FileReader failed'));reader.readAsDataURL(blob);});}
const DB_NAME='KATRO_MANGA_DB',DB_STORE='chapters';function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function saveChapterRecord(record){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(record);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};});}
async function getSavedChapter(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly'),req=tx.objectStore(DB_STORE).get(id);req.onsuccess=()=>{db.close();resolve(req.result||null);};req.onerror=()=>{db.close();reject(req.error);};});}
async function getAllSaved(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly'),req=tx.objectStore(DB_STORE).getAll();req.onsuccess=()=>{db.close();resolve(req.result||[]);};req.onerror=()=>{db.close();reject(req.error);};});}
async function deleteSavedChapter(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(id);tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error);};});}
async function saveChapterInternal(ch){const name=currentManga?titleOf(currentManga):'مانغا',num=ch.attributes?.chapter||'؟',progress=createDownloadProgress('حفظ دون إنترنت - '+name+' - '+num);try{if(await getSavedChapter(ch.id)){progress.fail('هذا الفصل محفوظ مسبقاً');return;}const urls=await getChapterPages(ch);if(!urls.length)throw Error('Empty chapter');const blobs=[];for(let i=0;i<urls.length;i++){progress.update(1+(i/urls.length)*95,'حفظ الصفحة '+(i+1)+' من '+urls.length);blobs.push(await fetchPageBlob(urls[i]));progress.update(1+((i+1)/urls.length)*95,'تم حفظ '+(i+1)+' من '+urls.length);}await saveChapterRecord({id:ch.id,mangaName:name,chapterNum:num,language:langNames[ch.attributes?.translatedLanguage]||ch.attributes?.translatedLanguage||'',pages:blobs,savedAt:Date.now()});progress.finish();}catch(e){progress.fail('تعذر حفظ الفصل: '+(e.message||''));console.error(e);}}
async function loadDownloads(){const box=document.getElementById('downloadsList');box.innerHTML='<div class="status">جاري عرض المحفوظات...</div>';try{const items=await getAllSaved();box.innerHTML='';if(!items.length){box.innerHTML='<div class="status">لا توجد فصول محفوظة حتى الآن.</div>';return;}items.sort((a,b)=>b.savedAt-a.savedAt);items.forEach(item=>{const div=document.createElement('div');div.className='downloadItem';const title=document.createElement('strong');title.textContent=item.mangaName;const info=document.createElement('p');info.textContent='الفصل '+item.chapterNum+' | '+item.language+' | '+item.pages.length+' صفحة';const read=makeButton('📖 قراءة',()=>readOffline(item));const del=makeButton('حذف',async()=>{if(confirm('هل تريد حذف الفصل المحفوظ؟')){await deleteSavedChapter(item.id);loadDownloads();}},'danger');div.append(title,info,read,del);box.appendChild(div);});}catch(e){box.innerHTML='<div class="status">تعذر قراءة المحفوظات.</div>';console.error(e);}}
function readOffline(item){document.getElementById('reader').classList.remove('hidden');document.getElementById('readerTitle').textContent=item.mangaName+' - الفصل '+item.chapterNum;const box=document.getElementById('readerPages');box.innerHTML='';item.pages.forEach((blob,i)=>{const img=document.createElement('img');img.alt='صفحة '+(i+1);img.loading='lazy';img.src=URL.createObjectURL(blob);box.appendChild(img);});}
selectCategory('manga');


<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080912">
<meta name="description" content="KATRO Manga - اكتشف المانغا والمانهوا واقرأ فصولك المفضلة">
<link rel="manifest" href="./manifest.json">
<title>KATRO Manga | كاترو</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#080912;
--card:#111827;
--card2:#1a2233;
--purple:#8855ff;
--green:#22c55e;
--text:#fff;
--muted:#9ca3af;
--border:#263246
}
body{
background:var(--bg);
color:var(--text);
font-family:Arial,Tahoma,sans-serif;
min-height:100vh
}
button,input,select{font:inherit}
button{
background:var(--purple);
color:white;
border:0;
padding:11px 15px;
border-radius:10px;
cursor:pointer
}
button:disabled{opacity:.5}
input,select{
width:100%;
background:#1c2535;
color:white;
border:1px solid var(--border);
padding:12px;
border-radius:10px
}
header{
position:sticky;
top:0;
z-index:100;
background:#111827f2;
backdrop-filter:blur(12px);
border-bottom:1px solid var(--border);
padding:14px
}
nav{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
flex-wrap:wrap
}
.logo{
font-size:23px;
font-weight:900;
letter-spacing:1px
}
.logo span{color:var(--purple)}
.nav-links{
display:flex;
gap:6px;
list-style:none;
flex-wrap:wrap
}
.nav-links button{
background:#202938;
padding:8px 10px;
font-size:12px
}
.nav-links button.active{background:var(--purple)}
.container{padding:18px 14px;max-width:1400px;margin:auto}
.sectionHeader{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin:10px 0 18px
}
.sectionHeader h2{font-size:19px}
.badge{
font-size:12px;
background:#211a35;
color:#c4aaff;
border:1px solid #443565;
padding:5px 10px;
border-radius:30px
}
.filterRow{
display:flex;
gap:10px;
margin:12px 0;
flex-wrap:wrap
}
.filterRow select{flex:1;min-width:130px}
.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px
}
.card{
background:var(--card);
border:1px solid var(--border);
border-radius:13px;
overflow:hidden;
cursor:pointer;
position:relative
}
.card img{
width:100%;
height:230px;
object-fit:cover;
background:#202938;
display:block
}
.cardInfo{padding:10px}
.cardInfo h3{
font-size:13px;
line-height:1.6;
margin-bottom:5px
}
.cardInfo p{font-size:11px;color:var(--muted)}
.cardBadges{
position:absolute;
top:8px;
right:8px;
display:flex;
flex-direction:column;
gap:5px
}
.cardBadges span{
background:#171326eF;
color:#d4c5ff;
border:1px solid #554277;
border-radius:6px;
padding:4px 7px;
font-size:10px
}
.status{
background:#151d2a;
color:#aaa;
padding:20px;
text-align:center;
border-radius:10px;
margin:12px 0
}
.hidden{display:none!important}
.panel{
background:var(--card);
border:1px solid var(--border);
padding:14px;
border-radius:13px;
margin-bottom:12px
}
.detailHeader{
display:flex;
gap:14px;
align-items:flex-start
}
#detailCover{
width:130px;
height:190px;
object-fit:cover;
border-radius:10px;
background:#202938
}
#detailDescription{
color:#aeb8c8;
font-size:13px;
line-height:1.8;
margin-top:8px;
max-height:220px;
overflow:auto
}
.sourceLinks{
display:flex;
flex-wrap:wrap;
gap:7px;
margin:12px 0
}
.sourceLinks a{
background:#202938;
border:1px solid #34445c;
padding:8px 12px;
border-radius:8px;
font-size:12px;
color:#d8c9ff
}
.chapter{
background:#202938;
padding:12px;
margin:9px 0;
border-radius:10px;
border:1px solid #2d3b50
}
.chapter small{
display:block;
color:#aeb8c8;
margin-top:6px
}
.chapterActions{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:10px
}
.chapterActions button{
flex:1;
min-width:65px;
padding:9px 5px;
font-size:12px
}
.secondary{background:#354157}
.danger{background:#b52b42}
#moreSearch,#moreChapters{width:100%;margin:15px 0}
#reader{
position:fixed;
inset:0;
z-index:300;
overflow:auto;
background:#05070b
}
.readerTop{
position:sticky;
top:0;
background:#111827;
padding:10px;
display:flex;
align-items:center;
gap:6px;
z-index:3
}
.readerTop button{font-size:12px;padding:9px}
.readerTitle{
flex:1;
text-align:center;
font-size:12px;
overflow:hidden
}
.pages img{
display:block;
width:100%;
max-width:1000px;
height:auto;
margin:auto
}
.downloadItem{
background:#182233;
padding:13px;
margin:10px 0;
border-radius:12px;
border:1px solid var(--border)
}
.downloadItem p{
color:#aeb8c8;
font-size:12px;
margin:8px 0
}
.downloadItem button{margin:5px}
.download-progress-box{
background:#0c1420;
border:1px solid #263246;
border-radius:12px;
padding:12px;
margin:10px 0
}
.download-progress-track{
height:12px;
width:100%;
background:#263246;
border-radius:20px;
overflow:hidden;
margin:10px 0
}
.download-progress-bar{
height:100%;
width:1%;
background:linear-gradient(90deg,#16a34a,#4ade80);
border-radius:20px;
transition:width .15s ease
}
.download-progress-info{
display:flex;
justify-content:space-between;
gap:10px;
font-size:12px
}
.download-progress-percent{
color:#4ade80;
font-weight:bold
}
.download-progress-status{color:#b5bfd0}
.download-progress-error{
background:linear-gradient(90deg,#ef4444,#991b1b)
}
.alertBox{
background:#2a1f3d;
padding:12px;
border-radius:10px;
margin:10px 0;
font-size:13px
}
footer{
border-top:1px solid var(--border);
padding:30px 15px;
text-align:center;
color:#777;
font-size:12px
}
@media(min-width:600px){
.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.card img{height:300px}
.container{padding:25px}
}
@media(min-width:950px){
.grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
</style>
</head>

<body>

<header>
<nav>
<div class="logo" onclick="selectCategory('manga')">KATRO<span>.</span></div>
<ul class="nav-links">
<li><button id="navManga" onclick="selectCategory('manga')">مانغا 🇯🇵</button></li>
<li><button id="navManhwa" onclick="selectCategory('manhwa')">مانهوا 🇰🇷</button></li>
<li><button id="navAll" onclick="selectCategory('all')">الكل 🌍</button></li>
<li><button id="navDownloads" onclick="showTab('downloadsTab')">تحميلاتي 📥</button></li>
</ul>
</nav>
</header>

<main class="container">

<section id="searchTab">

<div class="sectionHeader">
<h2 id="categoryTitle">المانغا</h2>
<span class="badge" id="categoryBadge">KATRO</span>
</div>

<input id="search" placeholder="ابحث باسم المانغا أو المانهوا..." autocomplete="off">

<div class="filterRow">
<select id="searchTypeFilter" onchange="onTypeFilterChange()">
<option value="manga">المانغا اليابانية 🇯🇵</option>
<option value="manhwa">المانهوا الكورية 🇰🇷</option>
<option value="all">جميع الأنواع 🌍</option>
</select>

<select id="searchLangFilter" onchange="searchManga(true)">
<option value="ar">الفصول العربية أولاً</option>
<option value="all">جميع اللغات</option>
</select>
</div>

<div id="results" class="grid"></div>
<div id="searchStatus" class="status">جاري تحميل الأعمال...</div>
<button id="moreSearch" class="hidden" onclick="loadMoreSearch()">عرض المزيد</button>

</section>

<section id="detailTab" class="hidden">

<button class="secondary" onclick="showTab('searchTab')" style="margin-bottom:12px">⬅ رجوع</button>

<div class="panel detailHeader">
<img id="detailCover" alt="غلاف">
<div>
<h2 id="detailTitle"></h2>
<p id="detailDescription"></p>
</div>
</div>

<div class="panel">
<label>لغة الفصول</label>
<select id="language">
<option value="ar">العربية مع بدائل</option>
<option value="ar_only">العربية فقط</option>
<option value="en">الإنجليزية</option>
<option value="all">جميع اللغات</option>
</select>
<button style="width:100%;margin-top:10px" onclick="loadChapters(true)">عرض الفصول</button>

<div id="sourceLinks" class="sourceLinks"></div>
</div>

<div id="chapters"></div>

</section>

<section id="downloadsTab" class="hidden">
<h2 style="margin-bottom:12px">📥 تحميلاتي</h2>
<div id="downloadsList"></div>
</section>

</main>

<div id="reader" class="hidden">
<div class="readerTop">
<button onclick="closeReader()">✕</button>
<button class="secondary" onclick="readerPrevious()">السابق</button>
<div class="readerTitle" id="readerTitle">KATRO Reader</div>
<button onclick="readerNext()">التالي</button>
</div>
<div id="readerPages" class="pages"></div>
</div>

<footer>
<div class="logo">KATRO<span>.</span></div>
<p>© 2026 KATRO Manga — عالم المانغا والمانهوا</p>
</footer>
</body>
</html>

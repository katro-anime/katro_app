
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>KATRO Manga</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:Arial,Tahoma,sans-serif}
header{padding:16px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
input,button,select{font:inherit;border:0;border-radius:12px;padding:12px}
input{width:100%;background:#f1f2f5;color:#111}
button{background:#222;color:white;cursor:pointer}
.container{padding:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#f5f5f7;border-radius:14px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#eee}
.card h3{font-size:14px;padding:8px;margin:0}
#reader{position:fixed;inset:0;background:#fff;overflow:auto;z-index:100;display:none}
#reader img{display:block;width:100%;height:auto}
#readerHeader{position:sticky;top:0;background:#fff;padding:12px;display:flex;justify-content:space-between;z-index:2;border-bottom:1px solid #eee}
#chapters{padding:12px}
.chapter{background:#f1f1f3;padding:12px;margin:6px 0;border-radius:10px}
#downloadProgress{height:8px;background:#eee;border-radius:20px;overflow:hidden;margin-top:10px}
#downloadBar{height:100%;width:0;background:#16a34a;transition:width .2s}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h2>KATRO Manga</h2>
<input id="search" placeholder="ابحث عن مانغا أو مانهوا..." autocomplete="off">
<button onclick="searchManga()">بحث</button>
</header>
<div class="container">
<div id="status"></div>
<div id="results" class="grid"></div>
<div id="chapters"></div>
<div id="downloadProgress" class="hidden"><div id="downloadBar"></div></div>
</div>
<div id="reader">
<div id="readerHeader"><button onclick="closeReader()">إغلاق</button><span id="readerTitle"></span></div>
<div id="readerPages"></div>
</div>
<script>
const API="https://katro-manga-api-v2.mmmzzz126038.workers.dev";
let searchController=null,searchToken=0;
let currentManga=null,chapterToken=0;
const $=id=>document.getElementById(id);
function status(t){$("status").textContent=t}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cover(m){return m.coverUrl||m.cover||m.attributes?.coverUrl||`${API}/covers/${m.id}`}
function title(m){
 const a=m.attributes?.title||m.title||{};
 if(typeof a==="string")return a;
 return a.ar||a.en||a.ja||Object.values(a)[0]||"بدون عنوان";
}
async function searchManga(){
 const q=$("search").value.trim();if(!q)return;
 if(searchController)searchController.abort();
 const controller=new AbortController();searchController=controller;
 const token=++searchToken;
 status("جار البحث...");
 $("results").innerHTML="";$("chapters").innerHTML="";
 try{
  const r=await fetch(`${API}/manga?q=${encodeURIComponent(q)}&limit=30`,{signal:controller.signal});
  if(!r.ok)throw Error();
  const d=await r.json();
  if(token!==searchToken)return;
  const items=d.data||d.results||[];
  status(items.length?`تم العثور على ${items.length} نتيجة`:"لا توجد نتائج");
  items.forEach(m=>{
   const card=document.createElement("div");card.className="card";
   card.innerHTML=`<img loading="lazy" src="${esc(cover(m))}" alt=""><h3>${esc(title(m))}</h3>`;
   card.onclick=()=>openManga(m);$("results").appendChild(card);
  });
 }catch(e){if(e.name!=="AbortError"&&token===searchToken)status("تعذر البحث")}
}
async function openManga(m){
 currentManga=m;$("chapters").innerHTML="";
 status(title(m));
 try{
  const r=await fetch(`${API}/manga/${encodeURIComponent(m.id)}/feed?limit=500&offset=0&order[chapter]=asc&lang=all`);
  if(!r.ok)throw Error();
  const d=await r.json(),items=d.data||d.results||[];
  if(!items.length){$("chapters").textContent="لا توجد فصول";return}
  items.forEach(ch=>{
   const a=ch.attributes||{};
   const div=document.createElement("div");div.className="chapter";
   div.textContent=`الفصل ${a.chapter||"?"} ${a.title||""} (${a.translatedLanguage||""})`;
   div.onclick=()=>readChapter(ch);$("chapters").appendChild(div);
  });
 }catch(e){$("chapters").textContent="تعذر تحميل الفصول"}
}
async function readChapter(ch){
 const token=++chapterToken;
 $("reader").style.display="block";$("readerPages").innerHTML="";
 $("readerTitle").textContent="جار تحميل الفصل...";
 try{
  const r=await fetch(`${API}/at-home/server/${encodeURIComponent(ch.id)}`);
  if(!r.ok)throw Error();
  const d=await r.json();if(token!==chapterToken)return;
  const base=d.baseUrl,hash=d.chapter.hash,pages=d.chapter.data||[];
  $("readerTitle").textContent=`الفصل ${ch.attributes?.chapter||""}`;
  pages.forEach((p,i)=>{
   const img=document.createElement("img");
   img.loading=i<3?"eager":"lazy";
   img.src=`${base}/data/${hash}/${encodeURIComponent(p)}`;
   img.onerror=()=>{img.src=`${base}/data-saver/${hash}/${encodeURIComponent(d.chapter.dataSaver?.[i]||p)}`};
   $("readerPages").appendChild(img);
  });
 }catch(e){if(token===chapterToken)$("readerTitle").textContent="تعذر تحميل الفصل"}
}
function closeReader(){chapterToken++;$("reader").style.display="none"}
$("search").addEventListener("keydown",e=>{if(e.key==="Enter")searchManga()});
</script>
</body>
</html>

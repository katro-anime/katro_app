<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KATRO | عالم المانغا والمانهو</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080912;--card:#101321;--purple:#8855ff;--blue:#28b8ff;--white:#ffffff;--muted:#9699b2;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--white);overflow-x:hidden;}
a{text-decoration:none;color:inherit}
header{width:100%;position:sticky;top:0;z-index:100;background:#111827dd;backdrop-filter:blur(10px);border-bottom:1px solid #263246;padding:15px 7%;}
nav{display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:25px;font-weight:900;letter-spacing:2px;cursor:pointer;}
.logo span{color:var(--purple)}
.nav-links{display:flex;gap:15px;list-style:none;color:#c4c5d5;font-size:14px;align-items:center;}
.nav-links a{cursor:pointer;padding:6px 10px;border-radius:8px;transition:.2s}
.nav-links a:hover{color:var(--white);background:#202938}
input,button,select{font:inherit;border:0;border-radius:10px;padding:12px}
input,select{background:#202938;color:white;width:100%}
button{background:var(--purple);color:white;font-weight:bold;cursor:pointer;transition:.3s}
button:active{opacity:.75}
.container{padding:30px 7%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:20px}
.card{background:#151d2a;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid #263246;position:relative;transition:.3s}
.card:hover{transform:translateY(-5px);border-color:var(--purple)}
.card img{width:100%;height:230px;object-fit:cover;background:#202938}
.card .info{padding:12px}
.card h3{margin:0 0 5px;font-size:14px}
.card p{margin:0;font-size:12px;color:#9ba9bc}
.badge-manga{position:absolute;top:8px;right:8px;background:var(--purple);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;font-weight:bold}
.status{text-align:center;padding:20px;color:#aaa;background:#151d2a;border-radius:10px;margin:10px 0}
.secondary{background:#303b50}
.hidden{display:none!important}
.hero{min-height:85vh;display:flex;align-items:center;padding:80px 7%;position:relative;overflow:hidden}
.hero-content{position:relative;z-index:2;max-width:750px}
.hero h1{font-size:clamp(35px, 6vw, 65px);font-weight:900;line-height:1.3;margin-bottom:20px}
.hero h1 span{background:linear-gradient(90deg, #a77aff, #42c8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:16px;line-height:1.8;margin-bottom:30px}
footer{padding:30px 7%;border-top:1px solid #1b1d2b;text-align:center;color:#777990;font-size:13px;margin-top:50px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card img{height:300px}}
</style>
</head>
<body>

  <header>
    <nav

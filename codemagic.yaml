
workflows:
  katro-android:
    name: KATRO Manga APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 21

    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Create Android project
        script: |
          npx cap add android

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Install ImageMagick
        script: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate KATRO icons
        script: |
          bash scripts/create-android-icons.sh

      - name: Verify KATRO icons
        script: |
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          echo "KATRO icons verified"

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
